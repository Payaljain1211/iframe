<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .box{
            height:100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background :linear-gradient(90deg,lightblue,violet) ;
        }
        form{
            height: 90%;
            width: 30%;
            /* margin-top: 10px; */
            background-color: white;
            border-radius: 10px;
        }
        .input{
            width: 80%;
            /* height: 70%; */
            margin: auto;
            margin-top: 5%;
            /* border: 1px solid black; */
            
        }
        input{
            margin: 10px;
            border-radius: 5px;
            background-color: lightgray;
            border: none;
            height: 18px;
        }
        .button{
            margin: auto;
            width: 80%;
            margin-top: 0px;
            text-align: center;
        }
        button{
            background: linear-gradient(90deg,lightblue,violet);
            /* margin-top: 10px; */
            /* margin-left: 55px; */
            height: 30px;
            width: 100%;
            border-radius: 10px;
            border: none;
        }
        h1{
            margin-top: 2%;
        }
        a{
            color: rgb(70, 126, 205);
            /* text-decoration: none; */
        }
    </style>
</head>
<body>
    <div class="box">
        <form action="">
            <h1 align="center">Sign up form</h1>
            <div class="input">
                <label for="">First Name:</label>
                <input type="text"><br>
                <label for="">Last Name:</label>
                <input type="text"><br>
                <label for="">Gender:</label>
                <input type="radio" name="gen">Female
                <input type="radio" name="gen">Male <br>
                <label for="">Phone number:</label>
                <input type="tel"><br>
                <label for="">Date Of Birth:</label>
                <input type="date"><br>
                <label for="">Email:</label>
                <input type="email"><br>
                <label for="">Confirm Email:</label>
                <input type="email"><br>
                <label for="">Password:</label>
                <input type="password"><br>
                <label for="">Confirm Password:</label>
                <input type="password"><br>
            </div>
            <div class="button">
                <input type="checkbox">Terms and condition
                <button>Submit</button>
                <p align="center">Already Member? <a href="assignment10.html">Log_in</a></p>
            </div>
        </form>
    </div>
</body>
</html>
