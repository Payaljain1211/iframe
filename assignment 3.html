<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }
    .container{
        height: 735px;
        border: 2px solid black;
    }
        .header {
            height: 20%;
            background-color: rgb(245, 220, 238);
        }
        .center{
            height: 60%;
            display:flex;
            flex-direction: row;

        }
        .left{
            height: 100%;
            width: 30%;
            background-color: coral;
        }
        .right{
            height: 100%;
            width: 70%;
            flex-direction: row;
        }
          .top{
            height: 50%;
            background-color: darkgrey;
        }
        .bottom{
            height: 50%;
            display:flex;

        }
            .b1{
                height: 100%;
                width: 50%;
                background-color: violet;
            }
             .b2{
                height: 100%;
                width: 50%;
                background-color: yellowgreen;
            }
        .footer{
            height: 20%;
            background-color: rgb(137, 213, 248);
        }

</style>
    </head>

<body>
    <h1 align="center">Flex box</h1>
    <div class="container">
        <div class="header"><H2 align="center">Header</H2></div>
            <div class="center">
                <div class="left"><H2 align="center">Left</H2></div>
                 <div class="right">
                    <div class="top"><H2 align="center">Top</H2></div>
                    <div class="bottom">
                        <div class="b1"><H2 align="center">Bottom 1</H2></div>
                        <div class="b2"><H2 align="center">Bottom 2</H2></div>
                    
                        </div>

                    </div>
                </div>
                <div class="footer"><H2 align="center">Footer</H2></div>
            </div>
        
    </div>
</body>
</html>
